<div class="card section-card">
          <h2>Transcode</h2>
          <p class="hint">
            These are the instance defaults, and they mirror what ErsatzTV next reads to encode a
            stream. Every channel follows them until it saves its own overrides — a channel stores
            only the fields it changes, so editing a setting here reaches every channel that has
            not overridden that one field.
          </p>
          <div class="actions">
            <button type="button" id="transcode-save" class="primary">Save transcode settings</button>
            <button type="button" id="transcode-reload" class="ghost">Discard changes</button>
          </div>
          <p class="hint" id="transcode-note"></p>
        </div>
        <div id="transcode-groups" class="settings"></div>
      </section>
