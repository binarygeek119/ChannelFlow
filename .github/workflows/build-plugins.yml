name: Build Plugins

on:
  push:
    branches: [v3]
    paths:
      - 'plugins/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build and package plugins
        run: ./build-plugins.sh

      - name: Upload plugin zips
        uses: actions/upload-artifact@v4
        with:
          name: plugins
          path: artifacts/*.zip
          retention-days: 30
