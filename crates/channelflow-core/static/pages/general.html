<div class="panel">
  <div class="panel-head">
    <h2>Addresses</h2>
  </div>
  <p class="hint">
    The addresses ChannelFlow is reached at. The <strong>local URL</strong> was detected on first
    boot; correct it here if it is wrong. The <strong>public URL</strong> is only for an instance
    exposed beyond your network.
  </p>
  <form id="general-form" class="ms-form" autocomplete="off">
    <div class="field">
      <label class="field-label" for="general-local-url">Local URL</label>
      <input id="general-local-url" type="url" placeholder="http://192.168.1.2:8097">
      <span class="field-hint">How ChannelFlow is reached on your local network.</span>
    </div>
    <div class="field">
      <label class="field-label" for="general-public-url">Public URL</label>
      <input id="general-public-url" type="url" placeholder="https://channelflow.example.com">
      <span class="field-hint">Optional. How it is reached from outside your network.</span>
    </div>
    <div class="ms-form-actions">
      <button type="submit" class="primary" id="general-save">Save</button>
    </div>
    <p class="field-note" id="general-result"></p>
  </form>
</div>
