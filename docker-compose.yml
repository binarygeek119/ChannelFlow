services:
  channelflow:
    build: .
    ports:
      - "8080:8080"
    environment:
      - DATABASE_PROVIDER=sqlite
      - CONNECTION_STRING=Data Source=/config/channelflow.db
      - ERSATZTV_PATH=ersatztv
      - ERSATZTV_URL=http://127.0.0.1:8409
    volumes:
      - ./config:/config
    restart: unless-stopped

