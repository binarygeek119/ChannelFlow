<div class="lineups-head">
  <h2>Lineups</h2>
  <p class="hint">Edit 24-hour schedules and playout</p>
</div>

<div class="lineup-toolbar">
  <div class="lineup-field">
    <label class="field-label" for="lineup-channel-select">Channel</label>
    <select id="lineup-channel-select"></select>
  </div>
  <div class="lineup-field">
    <label class="field-label" for="lineup-preview-date">Preview date</label>
    <input id="lineup-preview-date" type="date">
  </div>
  <button type="button" class="ghost" id="lineup-preview-run">Preview Day</button>
  <button type="button" class="primary" id="btn-save-lineup">Save Lineup</button>
  <button type="button" class="ghost" id="btn-rebuild-playout" disabled title="Playout is not built yet">Rebuild Playout</button>
  <span class="field-note" id="lineup-preview-banner" hidden></span>
</div>

<p class="hint" id="lineup-hint">
  Click a 30-minute slot to edit candidates. Check Rerun slot to fill it from yesterday's primetime (yellow). Click a Week lineups row to load that day's template.
</p>

<div class="lineup-grid" id="lineup-grid" role="grid" aria-label="48 half-hour slots"></div>
<span class="field-note" id="lineup-result"></span>

<div class="lineup-week-row">
  <h4>Week lineups</h4>
  <div id="override-list" class="override-list"></div>
</div>
