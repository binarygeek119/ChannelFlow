name: Docker image

# Builds the ChannelFlow 2.0 server on top of the ersatztv/next image and
# publishes it to the GitHub Container Registry.
#
# A version tag (`v2.0.0`) is the release switch: a push reads this workflow
# from the tagged commit, so it runs from `2.0.0` even though `master` is the
# repository's default branch. It can also be run by hand (Actions → Docker
# image → Run workflow), choosing the ref and the version.
#
# The image is linux/amd64 and lands as both `v<version>` and `<version>` —
# `latest` is left alone so it keeps pointing where it already does.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Version to tag the image with (e.g. 2.0.0)
        required: true
        type: string

permissions:
  contents: read
  packages: write

# A tag push and a manual run for the same version must not race.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      # A tag supplies the version (`v2.0.0` → `2.0.0`); a manual run takes the
      # input. Everything downstream uses this one value.
      - name: Work out the version
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          version="${version#v}"
          if [ -z "$version" ]; then
            echo "::error::no version — tag as v2.0.0, or pass a version input"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building ChannelFlow $version"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/channelflow
          tags: |
            type=raw,value=v${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha,prefix=

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # GHCR has no API to flip a package to Public; warn instead of failing a
      # release over something only a person can change.
      - name: Check GHCR package visibility
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          visibility=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/users/${{ github.repository_owner }}/packages/container/channelflow" \
            --jq .visibility 2>/dev/null || echo unknown)
          echo "GHCR package visibility: ${visibility}"
          if [ "${visibility}" != "public" ]; then
            echo "::warning::Set the package to Public at https://github.com/${{ github.repository_owner }}?tab=packages"
          fi
