<div class="panel">
  <div class="panel-head">
    <h2 id="people-heading">People</h2>
    <span class="count" id="people-count"></span>
  </div>
  <p class="hint" id="people-hint">
    Everyone synced from your media library's cast lists, alphabetical by name. Their
    pictures come with the library scan's image pass.
  </p>
  <div class="people-toolbar" id="people-toolbar">
    <input id="people-filter" type="search" placeholder="Filter people…" aria-label="Filter people">
  </div>
  <div class="people-grid" id="people-grid"></div>
  <p class="hint" id="people-empty" hidden>
    No people synced yet — run a library scan and the cast appears here.
  </p>
</div>
