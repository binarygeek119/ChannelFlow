<div class="panel">
          <div class="inner-tabs" id="library-inner-tabs"></div>
        </div>

        <div id="library-page-connections" class="library-page">
          <div class="panel">
            <div class="panel-head">
              <h2>Media connections</h2>
              <span class="count" id="ms-count"></span>
            </div>
            <p class="hint">
              Connections to media servers whose plugin is installed. Test one, edit it below, or open its
              server's tab to sync libraries.
            </p>
            <div class="ms-list" id="ms-connection-list"></div>
          </div>

          <div class="panel">
            <div class="panel-head">
              <h2 id="ms-form-title">Add connection</h2>
            </div>
            <p class="hint">The fields a connection needs come from the media-source plugin; the shared ones are below.</p>
            <form id="ms-form" class="ms-form" autocomplete="off">
              <div class="field">
                <label class="field-label" for="ms-kind">Media server</label>
                <select id="ms-kind"></select>
              </div>
              <div class="field">
                <label class="field-label" for="ms-name">Connection name</label>
                <input id="ms-name" type="text" placeholder="Home Jellyfin" required>
              </div>
              <div class="field">
                <label class="field-label" for="ms-url">Server URL</label>
                <input id="ms-url" type="url" placeholder="https://jellyfin.example.com" required>
              </div>
              <div class="field">
                <label class="field-label" for="ms-api-key">API key</label>
                <input id="ms-api-key" type="password" placeholder="(none)">
              </div>
              <div class="field">
                <label class="field-label" for="ms-remaps">Path remaps</label>
                <span class="field-hint">One per line: <code>/from -> /to</code></span>
                <textarea id="ms-remaps" rows="3" placeholder="/media -> /mnt/library"></textarea>
              </div>
              <div class="field">
                <label class="field-label" for="ms-verify-tls"><input id="ms-verify-tls" type="checkbox" checked> Verify TLS certificate</label>
              </div>
              <div class="field">
                <label class="field-label" for="ms-enabled"><input id="ms-enabled" type="checkbox" checked> Enabled</label>
              </div>
              <div class="ms-form-actions">
                <button type="button" class="ghost" id="ms-test" hidden>Test</button>
                <button type="submit" class="primary" id="ms-save">Save connection</button>
                <button type="button" class="ghost" id="ms-cancel" hidden>Cancel</button>
              </div>
              <p class="field-note" id="ms-result"></p>
            </form>
          </div>
        </div>
      </section>
