[package]
name = "channelflow-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ChannelFlow 2.0.0 — live TV channel server built on ErsatzTV next"

[[bin]]
# The binary ships as `channelflow` even though the crate is now the core,
# so the image, the entrypoint and every existing invocation keep working.
name = "channelflow"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
async-trait = "0.1"
axum.workspace = true
base64 = "0.22"
chrono.workspace = true
clap = { version = "4", features = ["derive", "env"] }
cron.workspace = true
# The SDK is fetched the same way the plugin repo fetches it — by git from
# this repo's own branch — so there is exactly one channelflow-plugin-api in
# the dependency graph and core's Plugin trait is the plugin's Plugin trait.
channelflow-plugin-api = { git = "https://github.com/binarygeek119/ChannelFlow", branch = "2.0.0" }
# The bundled plugins live in their own repo; the base builds against them by
# git so the combined image still ships them compiled in.
channelflow-plugin-ai = { git = "https://github.com/binarygeek119/ChannelFlow-Plugins", branch = "main" }
channelflow-plugin-ersatztv = { git = "https://github.com/binarygeek119/ChannelFlow-Plugins", branch = "main" }
channelflow-plugin-jellyfin = { git = "https://github.com/binarygeek119/ChannelFlow-Plugins", branch = "main" }
channelflow-plugin-offair = { git = "https://github.com/binarygeek119/ChannelFlow-Plugins", branch = "main" }
channelflow-plugin-commercialbrainz = { git = "https://github.com/binarygeek119/ChannelFlow-Plugins", branch = "main" }
channelflow-plugin-emergency = { git = "https://github.com/binarygeek119/ChannelFlow-Plugins", branch = "main" }
channelflow-plugin-weather = { git = "https://github.com/binarygeek119/ChannelFlow-Plugins", branch = "main" }
channelflow-plugin-news = { git = "https://github.com/binarygeek119/ChannelFlow-Plugins", branch = "main" }
reqwest.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "json", "uuid", "chrono"] }
tokio.workspace = true
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid.workspace = true
zip = "2"