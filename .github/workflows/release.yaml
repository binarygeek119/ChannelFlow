name: Release

# One "bump version" run: self-contained Windows + Linux packages,
# the Docker image on GHCR, and a GitHub release with the packages
# attached. Nothing builds on push or pull request.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (bump version, e.g. 0.0.2.96)
        required: true
        type: string
      rid:
        description: Runtimes to publish
        type: choice
        options:
          - all
          - linux-x64
          - win-x64
        default: all
      release:
        description: Attach the packages to a GitHub Release for v<version>
        type: boolean
        default: true

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid: ${{ inputs.rid == 'all' && fromJSON('["linux-x64","win-x64"]') || fromJSON(format('["{0}"]', inputs.rid)) }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Publish ${{ matrix.rid }}
        env:
          CHANNELFLOW_VERSION: ${{ inputs.version }}
          CHANNELFLOW_REVISION: ${{ github.sha }}
        run: bash scripts/publish-native.sh ${{ matrix.rid }}

      - name: Package ${{ matrix.rid }}
        env:
          VERSION: ${{ inputs.version }}
          RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail
          packages="$GITHUB_WORKSPACE/artifacts/packages"
          mkdir -p "$packages"
          cd "$GITHUB_WORKSPACE/artifacts/native"
          if [ "$RID" = "win-x64" ]; then
            out="$packages/channelflow-server-$RID-v$VERSION.zip"
            (cd "$RID" && zip -qr "$out" .)
          else
            out="$packages/channelflow-server-$RID-v$VERSION.tar.gz"
            tar -czf "$out" -C "$RID" .
          fi
          ls -lh "$packages"

      - name: Upload ${{ matrix.rid }}
        uses: actions/upload-artifact@v7
        with:
          name: channelflow-server-${{ matrix.rid }}
          path: artifacts/packages/*
          if-no-files-found: error
          retention-days: 30

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/binarygeek119/channelflow
          tags: |
            type=raw,value=v${{ inputs.version }}
            type=raw,value=${{ inputs.version }}
            type=raw,value=latest
            type=sha,prefix=

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CHANNELFLOW_VERSION=${{ inputs.version }}
            CHANNELFLOW_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check GHCR package visibility
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          visibility=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/users/${{ github.repository_owner }}/packages/container/channelflow" \
            --jq .visibility)
          echo "GHCR package visibility: ${visibility}"
          if [ "${visibility}" != "public" ]; then
            echo "::warning::GitHub has no API to change GHCR visibility. Set the package to Public at https://github.com/${{ github.repository_owner }}?tab=packages"
          fi

  release:
    needs: [publish, docker]
    if: ${{ inputs.release }}
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v7
        with:
          pattern: channelflow-server-*
          path: packages
          merge-multiple: true

      - name: Attach packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          ls -lh packages
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" packages/* --clobber
          else
            gh release create "$tag" packages/* \
              --title "$tag" \
              --generate-notes
          fi
          gh release view "$tag" --json assets --jq '.assets[].name'
