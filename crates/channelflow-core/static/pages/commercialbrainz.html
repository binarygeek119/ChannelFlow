<div class="panel">
          <div class="panel-head">
            <h2>CommercialBrainz</h2>
            <span class="count" id="cb-status"></span>
          </div>
          <p class="hint">
            Where ad avails come from and how picky the pool is. The server plus API token, the pool mode,
            how many results to sync, and the content filters. Test the connection before saving.
          </p>
          <form id="cb-form" class="ms-form" autocomplete="off">
            <div class="field">
              <label class="field-label" for="cb-enabled"><input id="cb-enabled" type="checkbox" checked> Enabled</label>
            </div>
            <div class="field">
              <label class="field-label" for="cb-base-url">Base URL</label>
              <input id="cb-base-url" type="url" placeholder="https://commercialbrainz.org">
            </div>
            <div class="field">
              <label class="field-label" for="cb-api-token">API token</label>
              <input id="cb-api-token" type="password" placeholder="(none)">
            </div>
            <div class="field">
              <label class="field-label" for="cb-pool-mode">Pool mode</label>
              <select id="cb-pool-mode"></select>
            </div>
            <div class="field">
              <label class="field-label" for="cb-max-sync">Max sync results</label>
              <input id="cb-max-sync" type="number" min="1" max="500" step="1" value="500">
            </div>
            <div class="field">
              <label class="field-label" for="cb-min-year">Min year</label>
              <input id="cb-min-year" type="number" placeholder="(any)">
            </div>
            <div class="field">
              <label class="field-label" for="cb-max-year">Max year</label>
              <input id="cb-max-year" type="number" placeholder="(any)">
            </div>
            <div class="field">
              <label class="field-label" for="cb-decades">Decades</label>
              <input id="cb-decades" type="text" placeholder="1970, 1980, 1990">
            </div>
            <div class="field">
              <label class="field-label" for="cb-brands">Brands</label>
              <input id="cb-brands" type="text" placeholder="Coca-Cola, McDonald's">
            </div>
            <div class="field">
              <label class="field-label" for="cb-tags">Tags</label>
              <input id="cb-tags" type="text" placeholder="christmas, superhero">
            </div>
            <div class="field">
              <label class="field-label" for="cb-exclude-tags">Exclude tags</label>
              <input id="cb-exclude-tags" type="text" placeholder="gore, politics">
            </div>
            <div class="field">
              <label class="field-label" for="cb-genres">Genres</label>
              <input id="cb-genres" type="text" placeholder="comedy, action">
            </div>
            <div class="field">
              <label class="field-label" for="cb-networks">Networks</label>
              <input id="cb-networks" type="text" placeholder="ABC, CNN">
            </div>
            <div class="field">
              <label class="field-label" for="cb-channel-names">Channel names</label>
              <input id="cb-channel-names" type="text" placeholder="Best 80s Movies">
            </div>
            <div class="field">
              <span class="field-label">Allow</span>
              <label class="field-note" for="cb-allow-spoof"><input id="cb-allow-spoof" type="checkbox" checked> Spoofs</label>
              <label class="field-note" for="cb-allow-fake"><input id="cb-allow-fake" type="checkbox" checked> Fake brands</label>
              <label class="field-note" for="cb-allow-real"><input id="cb-allow-real" type="checkbox" checked> Real brands</label>
              <label class="field-note" for="cb-allow-ai"><input id="cb-allow-ai" type="checkbox" checked> AI enhanced</label>
              <label class="field-note" for="cb-allow-latenight"><input id="cb-allow-latenight" type="checkbox" checked> Late night</label>
              <label class="field-note" for="cb-allow-adult"><input id="cb-allow-adult" type="checkbox"> Adult rated</label>
              <label class="field-note" for="cb-allow-banned"><input id="cb-allow-banned" type="checkbox"> Banned</label>
            </div>
            <div class="ms-form-actions">
              <button type="button" class="ghost" id="cb-test">Test connection</button>
              <button type="submit" class="primary" id="cb-save">Save</button>
            </div>
            <p class="field-note" id="cb-result"></p>
          </form>
        </div>
      </section>
